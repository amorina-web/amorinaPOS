<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Amorina</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--ac:#b0245a;--tx:#1d1b20;--mu:#6f6b76;--ln:#ececf0;--bg:#fff;--soft:#f7f6f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.4 Figtree,system-ui,sans-serif}
main{padding:16px 16px 96px;max-width:640px;margin:0 auto}
h1{font-size:26px;font-weight:800;margin:8px 0 14px;letter-spacing:-.02em}
h2{font-size:18px;font-weight:700;margin:20px 0 8px}
small,.mut{color:var(--mu);font-size:13px;display:block}
input,select{width:100%;font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--ln);border-radius:12px;background:#fff;color:var(--tx)}
input:focus,select:focus{outline:none;border-color:var(--ac)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 0}
label input,label select{margin-top:4px;color:var(--tx);font-size:16px}
.btn{border:0;background:var(--ac);color:#fff;font:700 15px Figtree,sans-serif;padding:12px 16px;border-radius:12px;white-space:nowrap}
.btn.s{padding:8px 12px;font-size:14px}.btn.big{width:100%;margin-top:12px;padding:15px}
.btn.ghost{background:var(--soft);color:var(--tx)}.btn:active{opacity:.8}
.bar{display:flex;gap:8px;margin-bottom:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}
.item b{display:block}.r{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.card{background:var(--soft);border-radius:16px;padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.big-n{font-size:40px;font-weight:800;letter-spacing:-.03em;color:var(--ac)}
.tot{display:flex;justify-content:space-between;align-items:center;font-size:20px;padding:12px 0}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:36px;height:36px;border:1.5px solid var(--ln);background:#fff;border-radius:10px;font-size:20px}
.qty input{width:52px;text-align:center;padding:8px 4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--ln);border-radius:12px;margin:8px 0;color:var(--tx);font-size:16px}
.opt input{width:20px;height:20px;margin:0}.opt span{flex:1;font-weight:600}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#fdebf2;color:var(--ac)}
.tag.ok{background:#e8f6ee;color:#1d7a46}
details.item{display:block}summary{display:flex;justify-content:space-between;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1 0 auto;border:0;background:none;padding:12px 11px;font:600 12px Figtree,sans-serif;color:var(--mu)}
nav button.on{color:var(--ac);box-shadow:inset 0 2px 0 var(--ac)}
#modal{position:fixed;inset:0;background:rgba(20,18,24,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
#modal[hidden],#app[hidden],#login[hidden]{display:none}
#sheet{background:#fff;width:100%;max-width:640px;max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain;border-radius:22px 22px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:90%}
#toast[hidden]{display:none}
#login{max-width:360px;margin:18vh auto;padding:0 20px}
.logo{font-size:34px;font-weight:800;color:var(--ac);letter-spacing:-.03em}
#ticket{border:1px solid var(--ln);border-radius:14px;padding:18px;margin-top:14px;text-align:center;background:#fff}
.tlogo{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.tf{color:var(--mu);font-size:13px;margin-top:8px}.tv{font-weight:700;margin:4px 0 10px}
#ticket hr{border:0;border-top:1px solid var(--tx);margin:10px 0}
.tr{display:grid;grid-template-columns:40px 1fr auto;gap:8px;text-align:left;padding:5px 0;font-size:15px}
.tr b{display:block}.tr span:last-child,.tr>b{text-align:right}.th{font-weight:700;font-size:13px}
.tr2{display:flex;justify-content:space-between;color:var(--mu);font-size:14px}
.tt{display:flex;justify-content:space-between;font-size:22px;font-weight:800;padding:4px 0}.tp{color:var(--mu);font-size:14px}
@media print{@page{margin:8mm}body>*:not(#modal){display:none!important}#modal{position:static;background:none;display:block}#sheet{max-height:none;overflow:visible;padding:0;animation:none}.noprint,.mh{display:none!important}#ticket{border:0;margin:0}}
.mh{position:sticky;top:-8px;z-index:2;background:#fff;display:flex;justify-content:flex-end;padding:10px 0 6px}
.x{width:42px;height:42px;border:0;border-radius:50%;background:var(--soft);font-size:18px;color:var(--tx)}
.card .btn.ghost{background:#fff;border:1.5px solid var(--ln)}
@media(prefers-reduced-motion:reduce){#sheet{animation:none}}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="logo">Amorina</div>
  <label>Email<input id="le" type="email" autocomplete="username"></label>
  <label>Contraseña<input id="lp" type="password" autocomplete="current-password"></label>
  <button class="btn big" onclick="entrar()">Ingresar</button>
</div>
<div id="app" hidden>
  <main id="main"></main>
  <nav>
    <button data-v="inicio" onclick="go('inicio')">Inicio</button>
    <button data-v="ventas" onclick="go('ventas')">Ventas</button>
    <button data-v="productos" onclick="go('productos')">Productos</button>
    <button data-v="caja" onclick="go('caja')">Caja</button>
    <button data-v="compras" onclick="go('compras')">Compras</button>
    <button data-v="stats" onclick="go('stats')">Estadísticas</button>
    <button data-v="config" onclick="go('config')">Config.</button>
  </nav>
</div>
<div id="modal" hidden onclick="if(event.target===this)cerrar()"><div id="sheet"></div></div>
<div id="toast" hidden></div>

<script>
// 1) Pegá acá los datos de tu proyecto (Supabase > Project Settings > API)
const SUPABASE_URL = 'https://qkhynoizdvsmevbigdti.supabase.co';
const SUPABASE_KEY = 'sb_publishable_AL6ECsr9mX2iYy5WOweqGA_Eyzn12kZ';

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const fm = n => '$' + Number(n || 0).toLocaleString('es-AR', { maximumFractionDigits: 0 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = { prods: [], medios: [], cfg: { margen: 100 }, cart: [] };
let sc = null, tt;

function toast(t) { const e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(tt); tt = setTimeout(() => e.hidden = true, 2200); }
function modal(h) {
  $('#sheet').innerHTML = '<div class="mh"><button class="x" onclick="cerrar()" aria-label="Cerrar">✕</button></div>' + h; $('#sheet').scrollTop = 0; $('#modal').hidden = false;
  if (!S.mo) { S.mo = 1; history.pushState({ m: 1 }, ''); }
}
async function cerrar() { if (sc) { try { await sc.stop(); } catch (e) {} sc = null; } $('#modal').hidden = true; S.mo = 0; }

// ---------- Sesión ----------
async function entrar() {
  const { error } = await db.auth.signInWithPassword({ email: $('#le').value.trim(), password: $('#lp').value });
  if (error) return toast('Email o contraseña incorrectos');
  start();
}
async function salir() { await db.auth.signOut(); location.reload(); }
async function start() { $('#login').hidden = true; $('#app').hidden = false; await load(); go('inicio'); }
async function load() {
  const [c, m, p, pv, ca, ta] = await Promise.all([
    db.from('config').select().eq('id', 1).single(),
    db.from('medios_pago').select().order('id'),
    db.from('productos').select().order('nombre'),
    db.from('proveedores').select().order('nombre'),
    db.from('categorias').select().order('nombre'),
    db.from('talles').select().order('id')
  ]);
  S.provs = pv.data || []; S.cats = ca.data || []; S.talles = ta.data || [];
  S.cfg = c.data || S.cfg; S.medios = m.data || []; S.prods = p.data || [];
}
async function go(v) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#main').innerHTML = ''; document.querySelector('nav .on')?.scrollIntoView({ inline: 'center', block: 'nearest' }); await V[v](); scrollTo(0, 0);
}

// ---------- Inicio ----------
async function inicio() {
  const n = new Date(), m0 = new Date(n.getFullYear(), n.getMonth(), 1), h0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const [v, c] = await Promise.all([
    db.from('ventas').select('fecha,total').gte('fecha', m0.toISOString()),
    db.from('compras').select('id').eq('estado', 'pendiente')
  ]);
  const vs = v.data || [], hoy = vs.filter(x => new Date(x.fecha) >= h0), sum = a => a.reduce((s, x) => s + +x.total, 0);
  const low = S.prods.filter(p => p.stock <= 2).slice(0, 8);
  $('#main').innerHTML = `<div class="logo">Amorina</div>
  <div class="card" style="margin-top:14px"><small>Vendido hoy · ${hoy.length} ventas</small><div class="big-n">${fm(sum(hoy))}</div></div>
  <div class="grid"><div class="card"><small>Este mes</small><b style="font-size:20px">${fm(sum(vs))}</b></div>
  <div class="card" onclick="go('compras')"><small>Compras por recibir</small><b style="font-size:20px">${(c.data || []).length}</b></div></div>
  <button class="btn big" onclick="go('ventas')">Nueva venta</button>
  <h2>Stock bajo</h2>${low.map(p => `<div class="item" onclick="go('productos')"><div><b>${esc(p.nombre)}</b><small>${esc(p.talle || '')} · ${esc(p.sku)}</small></div><span class="tag">${p.stock} u.</span></div>`).join('') || '<p class="mut">Todo con stock.</p>'}`;
}

// ---------- Ventas ----------
let lk = 0;
function ventas() {
  $('#main').innerHTML = `<h1>Ventas</h1>
  <div class="bar"><input id="q" placeholder="Nombre o código" oninput="buscar()" autocomplete="off"><button class="btn" onclick="scan()">Escanear</button></div>
  <button class="btn ghost big" style="margin:0 0 6px" onclick="formL()">Producto sin registro</button>
  <div id="res"></div><div id="cart"></div>`;
  buscar(); cartUI();
}
function buscar() {
  const t = ($('#q')?.value || '').trim().toLowerCase();
  const l = t ? S.prods.filter(p => (p.nombre + ' ' + p.sku).toLowerCase().includes(t)).slice(0, 15) : [];
  $('#res').innerHTML = l.map(p => `<div class="item"><div><b>${esc(p.nombre)}</b><small>${esc(p.talle || '')} · ${esc(p.sku)} · Stock ${p.stock}</small></div>
  <div class="r"><b>${fm(p.precio)}</b><button class="btn s" onclick="add(${p.id})">Agregar</button></div></div>`).join('') || (t ? '<p class="mut">No hay resultados.</p>' : '');
}
function add(id) {
  const p = S.prods.find(x => x.id === id), c = S.cart.find(x => x.k === 'p' + id), q = (c?.q || 0) + 1;
  if (q > p.stock) return toast('Sin stock suficiente de ' + p.nombre);
  c ? c.q = q : S.cart.push({ k: 'p' + id, id, q: 1 });
  toast('Agregado: ' + p.nombre); cartUI();
}
function formL() {
  modal(`<h2>Producto sin registro</h2>
  <label>Descripción<input id="ld" placeholder="Ej: Remera"></label>
  <div class="row2"><label>Cantidad<input id="lq" type="number" inputmode="numeric" value="1"></label><label>Precio de venta (c/u)<input id="lp2" type="number" inputmode="decimal"></label></div>
  <label>Costo (c/u, opcional)<input id="lc" type="number" inputmode="decimal"></label>
  <button class="btn big" onclick="addL()">Agregar al carrito</button><button class="btn ghost big" onclick="cerrar()">Cancelar</button>`);
}
function addL() {
  const d = $('#ld').value.trim(), q = parseInt($('#lq').value) || 0, p = +$('#lp2').value || 0;
  if (!d || q <= 0 || p <= 0) return toast('Completá descripción, cantidad y precio');
  S.cart.push({ k: 'l' + (++lk), libre: 1, desc: d, precio: p, costo: +$('#lc').value || 0, q });
  cerrar(); toast('Agregado: ' + d); cartUI();
}
const it = c => { if (c.libre) return { nombre: c.desc, talle: '', sku: '', precio: c.precio, costo: c.costo }; const p = S.prods.find(x => x.id === c.id); return { nombre: p.nombre, talle: p.talle, sku: p.sku, precio: p.precio, costo: p.costo }; };
function setq(k, q) {
  q = parseInt(q) || 0; const c = S.cart.find(x => x.k === k); if (!c) return;
  if (!c.libre) { const p = S.prods.find(x => x.id === c.id); if (q > p.stock) { q = p.stock; toast('Máximo en stock: ' + p.stock); } }
  if (q <= 0) S.cart = S.cart.filter(x => x.k !== k); else c.q = q;
  cartUI();
}
const sub = () => S.cart.reduce((s, c) => s + c.q * it(c).precio, 0);
function cartUI() {
  const el = $('#cart'); if (!el) return;
  el.innerHTML = S.cart.length ? `<h2>Carrito</h2>` + S.cart.map(c => { const i = it(c);
    return `<div class="item"><div><b>${esc(i.nombre)}</b><small>${esc(i.talle || '')}${c.libre ? 'Sin registro · ' : ' · '}${fm(i.precio)} c/u</small></div>
    <div class="qty"><button onclick="setq('${c.k}',${c.q - 1})">−</button><input type="number" inputmode="numeric" value="${c.q}" onchange="setq('${c.k}',this.value)"><button onclick="setq('${c.k}',${c.q + 1})">+</button></div></div>`; }).join('')
    + `<div class="tot"><span>Subtotal</span><b>${fm(sub())}</b></div><button class="btn big" onclick="cobrar()">Cobrar</button>` : '';
}
function cobrar() {
  if (!S.medios.length) return toast('Cargá medios de pago en Configuración');
  modal(`<h2>Medio de pago</h2>` + S.medios.map((m, i) => `<label class="opt"><input type="radio" name="mp" value="${m.id}" ${i ? '' : 'checked'} onchange="mpTot()"><span>${esc(m.nombre)}</span><small>${m.recargo > 0 ? '+' + m.recargo + '%' : ''}</small></label>`).join('')
    + `<div class="tot"><span>Total</span><b id="mt"></b></div><button class="btn big" onclick="confirmar()">Confirmar venta</button><button class="btn ghost big" onclick="cerrar()">Volver</button>`);
  mpTot();
}
const medioSel = () => S.medios.find(m => m.id == document.querySelector('input[name=mp]:checked')?.value);
function mpTot() { const m = medioSel(); $('#mt').textContent = fm(sub() * (1 + (m?.recargo || 0) / 100)); }
async function confirmar() {
  const m = medioSel(), s = sub(), rec = s * m.recargo / 100;
  const { data: v, error } = await db.from('ventas').insert({ subtotal: s, recargo: rec, total: s + rec, medio_pago: m.nombre }).select().single();
  if (error) return toast(error.message);
  const its = S.cart.map(c => { const i = it(c); return { venta_id: v.id, producto_id: c.libre ? null : c.id, nombre: i.nombre, sku: i.sku, talle: i.talle, cantidad: c.q, precio: i.precio, costo: i.costo || 0, libre: !!c.libre }; });
  await db.from('venta_items').insert(its);
  await Promise.all(S.cart.filter(c => !c.libre).map(c => db.rpc('ajustar_stock', { p_id: c.id, p_delta: -c.q })));
  S.cart = []; await load(); ticket(v, its, true);
}
function ticket(v, its, nueva) {
  modal(`<div id="ticket"><div class="tlogo">Amorina</div>
  <div class="tf">${new Date(v.fecha).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' })}</div><div class="tv">Venta #${v.id}</div><hr>
  <div class="tr th"><span>Cant</span><span>Producto</span><span>Total</span></div>
  ${its.map(i => `<div class="tr"><span>${i.cantidad}</span><span><b>${esc(i.nombre)} ${esc(i.talle || '')}</b><small>${i.cantidad} x ${fm(i.precio)}</small></span><b>${fm(i.cantidad * i.precio)}</b></div>`).join('')}
  <hr>${+v.recargo ? `<div class="tr2"><span>Recargo</span><span>${fm(v.recargo)}</span></div>` : ''}
  <div class="tt"><span>TOTAL:</span><span>${fm(v.total)}</span></div><hr><div class="tp">Pago: ${esc(v.medio_pago)}</div></div>
  <button class="btn big noprint" onclick="window.print()">Guardar como PDF</button>
  <button class="btn ghost big noprint" onclick="cerrar()${nueva ? ';ventas()' : ''}">Cerrar</button>`);
}
function verT(id) { const v = S.vs.find(x => x.id === id); ticket(v, v.venta_items, false); }
function scan() {
  modal(`<h2>Escanear código</h2><div id="reader"></div><button class="btn ghost big" onclick="cerrar()">Terminar</button>`);
  sc = new Html5Qrcode('reader'); let last = '', t = 0;
  sc.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 140 } }, code => {
    if (code === last && Date.now() - t < 2500) return; last = code; t = Date.now();
    const p = S.prods.find(x => x.sku.toLowerCase() === code.toLowerCase());
    p ? add(p.id) : toast('Código no encontrado: ' + code);
  }).catch(() => toast('No se pudo abrir la cámara'));
}

// ---------- Productos ----------
function productos() {
  $('#main').innerHTML = `<h1>Productos</h1><div class="bar"><input id="q" placeholder="Buscar" oninput="listP()"><button class="btn" onclick="formP()">Nuevo</button></div>
  <div class="row2" style="margin-bottom:10px"><select id="fc" onchange="listP()"><option value="">Todas las categorías</option>${S.cats.map(c => `<option value="${c.id}">${esc(c.nombre)}</option>`).join('')}</select><select id="ft" onchange="listP()"><option value="">Todos los talles</option>${S.talles.map(t => `<option>${esc(t.nombre)}</option>`).join('')}</select></div><div id="res"></div>`;
  listP();
}
const gkey = p => p.grupo || 'id' + p.id;
function gfor(n) {
  const k = n.toLowerCase(), ex = S.prods.find(p => p.nombre.toLowerCase() === k);
  return S.gnew[k] || (S.gnew[k] = ex ? gkey(ex) : crypto.randomUUID());
}
function listP() {
  const t = ($('#q')?.value || '').trim().toLowerCase(), fc = $('#fc')?.value || '', ft = $('#ft')?.value || '';
  const l = S.prods.filter(p => (!t || (p.nombre + ' ' + p.sku).toLowerCase().includes(t)) && (!fc || p.categoria_id == fc) && (!ft || p.talle === ft));
  const m = new Map(); l.forEach(p => { const k = gkey(p); if (!m.has(k)) m.set(k, []); m.get(k).push(p); });
  const gs = [...m.values()].sort((a, b) => a[0].nombre.localeCompare(b[0].nombre));
  const cn = id => S.cats.find(c => c.id === id)?.nombre || '';
  $('#res').innerHTML = (fc || ft ? `<small style="margin-bottom:4px">${gs.length} productos · ${l.reduce((s, p) => s + p.stock, 0)} unidades</small>` : '')
    + (gs.slice(0, 200).map(g => { const p = g[0], st = g.reduce((s, x) => s + x.stock, 0), pr = [...new Set(g.map(x => +x.precio))];
      return `<div class="item" onclick="formP(${p.id})"><div><b>${esc(p.nombre)}</b><small>${esc(g.map(x => (x.talle || 'Sin talle') + ' (' + x.stock + ')').join(' · '))}</small>${cn(p.categoria_id) ? `<small>${esc(cn(p.categoria_id))}</small>` : ''}</div>
      <div class="r"><b>${pr.length > 1 ? 'desde ' + fm(Math.min(...pr)) : fm(pr[0])}</b><span class="tag ${st > 2 ? 'ok' : ''}">${st} u.</span></div></div>`; }).join('') || '<p class="mut">No hay productos.</p>');
}
function rowV(v) {
  return `<div class="card vrow" data-id="${v.id || ''}" style="margin-top:8px"><div class="row2"><label>Talle<select class="vt" onchange="autoSku(this)">${talleOpts(v.talle)}</select></label><label>Código (SKU)<input class="vs" placeholder="Ej: A519" value="${esc(v.sku || '')}"></label></div>
  <div class="row2"><label>Stock (unidades)<input class="vk" type="number" inputmode="numeric" value="${v.stock ?? 0}"></label><div style="display:flex;flex-direction:column;gap:6px;justify-content:flex-end"><button class="btn ghost s" onclick="rmV(this)">Quitar talle</button></div></div></div>`;
}
function autoSku(sel) {
  const r = sel.closest('.vrow'), i = r.querySelector('.vs'), f = document.querySelector('.vrow');
  if (!i.value && r !== f && sel.value && f.querySelector('.vs').value) i.value = f.querySelector('.vs').value + '-' + sel.value;
}
function rmV(b) { const r = b.closest('.vrow'); if (r.dataset.id) { r.dataset.del = '1'; r.hidden = true; } else r.remove(); }
function formP(id) {
  const p0 = S.prods.find(x => x.id === id), p = p0 || {};
  const vs = p0 ? S.prods.filter(x => gkey(x) === gkey(p0)).sort((a, b) => a.id - b.id) : [];
  modal(`<h2>${p0 ? 'Editar' : 'Nuevo'} producto</h2>
  <label>Nombre<input id="pn" value="${esc(p.nombre || '')}"></label>
  <label>Categoría<select id="pg">${catOpts(p.categoria_id)}</select></label>
  <div class="row2"><label>Costo<input id="pc" type="number" inputmode="decimal" value="${p.costo ?? ''}" oninput="sug()"></label><label>Precio de venta<input id="pp" type="number" inputmode="decimal" value="${p.precio ?? ''}"></label></div>
  <small id="sg">El precio se sugiere con un margen de ${S.cfg.margen}% y podés cambiarlo. Vale para todos los talles.</small>
  ${p.costo_actualizado ? `<small>Costo actualizado el ${new Date(p.costo_actualizado).toLocaleDateString('es-AR')}</small>` : ''}
  <h2>Talles y stock</h2><small style="margin-bottom:4px">Cada fila es un talle de este producto.</small><div id="vr">${(vs.length ? vs : [{}]).map(rowV).join('')}</div>
  <button class="btn ghost big" onclick="$('#vr').insertAdjacentHTML('beforeend',rowV({}))">Agregar talle</button>
  <button class="btn big" onclick="saveP(${id || 0})">Guardar</button><button class="btn ghost big" onclick="cerrar()">Cancelar</button>${p0 ? `<button class="btn ghost big" onclick="delP(${id})">Eliminar producto</button>` : ''}`);
}
function sug() { const c = +$('#pc').value || 0, p = Math.round(c * (1 + S.cfg.margen / 100)); $('#pp').value = p; $('#sg').textContent = 'Precio sugerido: ' + fm(p); }
async function saveP(id) {
  const nombre = $('#pn').value.trim(); if (!nombre) return toast('Escribí el nombre');
  const base = { nombre, categoria_id: +$('#pg').value || null, costo: +$('#pc').value || 0, precio: +$('#pp').value || 0 };
  const rows = [...document.querySelectorAll('.vrow')].map(r => ({ id: r.dataset.id, del: r.dataset.del, talle: r.querySelector('.vt').value || null, sku: r.querySelector('.vs').value.trim(), stock: parseInt(r.querySelector('.vk').value) || 0 }));
  const act = rows.filter(r => !r.del), dels = rows.filter(r => r.del && r.id);
  if (!act.length) return toast('Agregá al menos un talle');
  if (act.some(r => !r.sku)) return toast('Falta el código de un talle');
  if (new Set(act.map(r => r.sku.toLowerCase())).size < act.length) return toast('Hay códigos repetidos');
  if (new Set(act.map(r => r.talle || '')).size < act.length) return toast('Hay un talle repetido');
  if (dels.length && !confirm(`¿Quitar ${dels.length} talle(s) de este producto?`)) return;
  const p0 = S.prods.find(x => x.id === id), grupo = p0 ? gkey(p0) : crypto.randomUUID();
  for (const r of act) {
    const o = { ...base, grupo, talle: r.talle, sku: r.sku, stock: r.stock };
    const { error } = r.id ? await db.from('productos').update(o).eq('id', r.id) : await db.from('productos').insert(o);
    if (error) return toast(error.code === '23505' ? 'El código ' + r.sku + ' ya existe' : error.message);
  }
  if (dels.length) await db.from('productos').delete().in('id', dels.map(r => +r.id));
  await cerrar(); await load(); toast('Producto guardado'); productos();
}
async function delP(id) {
  const p = S.prods.find(x => x.id === id), ids = S.prods.filter(x => gkey(x) === gkey(p)).map(x => x.id);
  if (!confirm(`¿Eliminar "${p.nombre}" con sus ${ids.length} talle(s)?`)) return;
  const { error } = await db.from('productos').delete().in('id', ids); if (error) return toast(error.message);
  await cerrar(); await load(); productos();
}

// ---------- Caja ----------
function caja() {
  S.cd = S.cd || new Date().toLocaleDateString('sv');
  $('#main').innerHTML = `<h1>Caja</h1><input type="date" id="cd" value="${S.cd}" onchange="S.cd=this.value;cajaL()"><div id="cl"></div>`; cajaL();
}
async function cajaL() {
  const a = new Date(S.cd + 'T00:00:00'), b = new Date(a); b.setDate(b.getDate() + 1);
  const { data } = await db.from('ventas').select('*,venta_items(*)').gte('fecha', a.toISOString()).lt('fecha', b.toISOString()).order('fecha', { ascending: false });
  S.vs = data || []; const por = {};
  S.vs.forEach(v => por[v.medio_pago] = (por[v.medio_pago] || 0) + +v.total);
  $('#cl').innerHTML = `<div class="card" style="margin-top:12px"><small>Total del día · ${S.vs.length} ventas</small><div class="big-n">${fm(S.vs.reduce((s, v) => s + +v.total, 0))}</div>
  ${Object.entries(por).map(([k, v]) => `<div class="item" style="padding:6px 0"><span>${esc(k)}</span><b>${fm(v)}</b></div>`).join('')}</div>
  <h2>Ventas</h2>` + (S.vs.map(v => `<details class="item"><summary><span>${new Date(v.fecha).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })} · ${esc(v.medio_pago)}</span><b>${fm(v.total)}</b></summary>
  ${v.venta_items.map(i => `<small>${i.cantidad} × ${esc(i.nombre)} ${esc(i.talle || '')} — ${fm(i.precio)}</small>`).join('')}
  ${+v.recargo ? `<small>Recargo: ${fm(v.recargo)}</small>` : ''}<div class="bar" style="margin-top:8px"><button class="btn s" onclick="verT(${v.id})">Ver ticket</button><button class="btn ghost s" onclick="anular(${v.id})">Anular venta</button></div></details>`).join('') || '<p class="mut">No hay ventas en este día.</p>');
}
async function anular(id) {
  if (!confirm('¿Anular esta venta? El stock vuelve a sumarse.')) return;
  const v = S.vs.find(x => x.id === id);
  await Promise.all(v.venta_items.filter(i => i.producto_id).map(i => db.rpc('ajustar_stock', { p_id: i.producto_id, p_delta: i.cantidad })));
  await db.from('ventas').delete().eq('id', id); await load(); toast('Venta anulada'); cajaL();
}

// ---------- Compras ----------
async function compras() {
  $('#main').innerHTML = `<h1>Compras</h1><div class="bar"><button class="btn" style="flex:1" onclick="formC()">Nueva compra</button><button class="btn ghost" onclick="provs()">Proveedores</button></div><div id="cl"></div>`;
  const { data } = await db.from('compras').select('*,compra_items(*)').order('fecha', { ascending: false }).limit(50);
  S.cs = data || [];
  $('#cl').innerHTML = S.cs.map(c => `<div class="item" onclick="verC(${c.id})"><div><b>${esc(c.proveedor)}</b><small>${new Date(c.fecha).toLocaleDateString('es-AR')}</small></div>
  <div class="r"><b>${fm(totC(c))}</b><span class="tag ${c.estado === 'recibida' ? 'ok' : ''}">${c.estado === 'recibida' ? 'Recibida' : 'Por recibir'}</span></div></div>`).join('') || '<p class="mut">Todavía no hay compras.</p>';
}
const subC = c => c.compra_items.reduce((s, i) => s + i.cantidad * i.costo, 0);
const totC = c => subC(c) + +c.envio;
const lblP = p => `${p.nombre}${p.talle ? ' ' + p.talle : ''} · ${p.sku}`;

// Proveedores
function provs() {
  modal(`<h2>Proveedores</h2>` + S.provs.map(p => `<div class="item"><div style="flex:1"><input value="${esc(p.nombre)}" onchange="upV(${p.id},'nombre',this.value)"><input value="${esc(p.telefono || '')}" placeholder="Teléfono" style="margin-top:6px" onchange="upV(${p.id},'telefono',this.value)"></div><button class="btn ghost s" onclick="delV(${p.id})">✕</button></div>`).join('')
    + `<label>Nuevo proveedor<input id="vn" placeholder="Nombre"></label><button class="btn big" onclick="addV()">Agregar proveedor</button><button class="btn ghost big" onclick="cerrar()">Cerrar</button>`);
}
async function upV(id, f, v) { await db.from('proveedores').update({ [f]: v.trim() }).eq('id', id); await load(); toast('Guardado'); }
async function addV() { const n = $('#vn').value.trim(); if (!n) return toast('Escribí el nombre'); await db.from('proveedores').insert({ nombre: n }); await load(); provs(); toast('Proveedor agregado'); }
async function delV(id) { if (!confirm('¿Eliminar este proveedor?')) return; await db.from('proveedores').delete().eq('id', id); await load(); provs(); }
const provOpts = () => `<option value="">Elegir proveedor</option>` + S.provs.map(p => `<option value="${p.id}">${esc(p.nombre)}</option>`).join('');
async function newV() {
  const n = (prompt('Nombre del proveedor') || '').trim(); if (!n) return;
  const { data } = await db.from('proveedores').insert({ nombre: n }).select().single();
  await load(); $('#cv').innerHTML = provOpts(); $('#cv').value = data.id;
}

// Nueva compra
function rowC() {
  return `<div class="card ci" style="margin-top:10px"><input class="cs" list="dl" placeholder="Buscar producto o escribir uno nuevo" onchange="pickC(this)"><small class="cm"></small>
  <div class="cn" hidden><div class="row2" style="margin-top:6px"><input class="ck" placeholder="Código SKU"><select class="ct">${talleOpts('')}</select></div><select class="cg" style="margin-top:6px">${catOpts('')}</select></div>
  <div class="row2" style="margin-top:6px"><input class="cq" type="number" inputmode="numeric" placeholder="Cantidad" value="1" oninput="totC2()"><input class="cc" type="number" inputmode="decimal" placeholder="Costo unitario" oninput="totC2()"></div></div>`;
}
function pickC(i) {
  const r = i.closest('.ci'), v = i.value.trim(), p = S.prods.find(x => lblP(x) === v);
  r.dataset.pid = p ? p.id : ''; r.querySelector('.cn').hidden = !!p || !v;
  r.querySelector('.cm').textContent = p ? 'Ya cargado · stock ' + p.stock : (v ? 'Producto nuevo: completá código y talle' : '');
  if (p) r.querySelector('.cc').value = p.costo; totC2();
}
function totC2() { $('#ct').textContent = fm([...document.querySelectorAll('.ci')].reduce((s, r) => s + (parseInt(r.querySelector('.cq').value) || 0) * (+r.querySelector('.cc').value || 0), 0)); }
function formC() {
  modal(`<h2>Nueva compra</h2><label>Proveedor<select id="cv">${provOpts()}</select></label><button class="btn ghost s" style="margin-top:6px" onclick="newV()">+ Nuevo proveedor</button>
  <datalist id="dl">${S.prods.map(p => `<option value="${esc(lblP(p))}">`).join('')}</datalist>
  <div id="ci">${rowC()}</div><button class="btn ghost big" onclick="$('#ci').insertAdjacentHTML('beforeend',rowC())">Agregar otro producto</button>
  <div class="tot"><span>Total de la compra</span><b id="ct">$0</b></div><small>El envío se carga al recibir y se reparte en el costo de cada producto.</small>
  <button class="btn big" onclick="saveC()">Guardar compra</button><button class="btn ghost big" onclick="cerrar()">Cancelar</button>`);
}
async function saveC() {
  const pv = S.provs.find(x => x.id == $('#cv').value); if (!pv) return toast('Elegí un proveedor');
  const rows = [...document.querySelectorAll('.ci')].map(r => ({ pid: r.dataset.pid || '', nombre: r.querySelector('.cs').value.trim(), sku: r.querySelector('.ck').value.trim(), talle: r.querySelector('.ct').value.trim() || null, cat: +r.querySelector('.cg').value || null, q: parseInt(r.querySelector('.cq').value) || 0, costo: +r.querySelector('.cc').value || 0 })).filter(x => x.nombre && x.q > 0);
  if (!rows.length) return toast('Agregá al menos un producto');
  if (rows.some(x => !x.pid && !x.sku)) return toast('Falta el código de un producto nuevo');
  const nuevos = rows.filter(x => !x.pid); S.gnew = {};
  if (nuevos.length) {
    const { data, error } = await db.from('productos').insert(nuevos.map(x => ({ nombre: x.nombre, sku: x.sku, talle: x.talle, categoria_id: x.cat, grupo: gfor(x.nombre), costo: x.costo, precio: Math.round(x.costo * (1 + S.cfg.margen / 100)), stock: 0 }))).select();
    if (error) return toast(error.code === '23505' ? 'Un código ya existe: buscalo en la lista' : error.message);
    nuevos.forEach(x => x.pid = data.find(d => d.sku === x.sku).id);
  }
  const { data: c, error } = await db.from('compras').insert({ proveedor_id: pv.id, proveedor: pv.nombre }).select().single();
  if (error) return toast(error.message);
  await db.from('compra_items').insert(rows.map(x => ({ compra_id: c.id, producto_id: +x.pid, descripcion: x.nombre, cantidad: x.q, costo: x.costo })));
  await cerrar(); await load(); toast('Compra guardada'); compras();
}

// Ver y recibir
function verC(id) {
  const c = S.cs.find(x => x.id === id), rec = c.estado === 'recibida';
  modal(`<h2>${esc(c.proveedor)}</h2>` + c.compra_items.map(i => `<div class="item"><div><b>${esc(i.descripcion || '')}</b><small>${i.cantidad} × ${fm(i.costo)}${rec && i.costo_final ? ' · costo final ' + fm(i.costo_final) : ''}</small></div><b>${fm(i.cantidad * i.costo)}</b></div>`).join('')
    + (rec ? `<div class="item"><span>Envío</span><b>${fm(c.envio)}</b></div>` : '') + `<div class="tot"><span>Total</span><b>${fm(totC(c))}</b></div>`
    + (rec ? `<small>Recibida el ${new Date(c.recibida_el).toLocaleDateString('es-AR')}</small>` : `<button class="btn big" onclick="recibirForm(${id})">Recibir mercadería</button>`)
    + `<button class="btn ghost big" onclick="cerrar()">Cerrar</button><button class="btn ghost big" onclick="delC(${id})">Eliminar compra</button>`);
}
function recibirForm(id) {
  const c = S.cs.find(x => x.id === id);
  modal(`<h2>Recibir compra</h2><small>${esc(c.proveedor)} · Mercadería ${fm(subC(c))}</small>
  <label>Costo de envío<input id="re" type="number" inputmode="decimal" value="0" oninput="prevR(${id})"></label><div id="rp"></div>
  <label class="opt"><input type="checkbox" id="rpr"><span>Actualizar precio de venta con mi margen</span></label>
  <button class="btn big" onclick="recibir(${id})">Confirmar recepción</button><button class="btn ghost big" onclick="verC(${id})">Volver</button>`);
  prevR(id);
}
function prevR(id) {
  const c = S.cs.find(x => x.id === id), s = subC(c), e = +$('#re').value || 0, f = s ? e / s : 0;
  $('#rp').innerHTML = `<h2>Costo final por unidad</h2>` + c.compra_items.map(i => `<div class="item"><div><b>${esc(i.descripcion || '')}</b><small>${i.cantidad} u. · +${(f * 100).toFixed(1)}% de envío</small></div><div class="r"><small>${fm(i.costo)} →</small><b>${fm(Math.round(i.costo * (1 + f) * 100) / 100)}</b></div></div>`).join('')
    + `<div class="tot"><span>Total con envío</span><b>${fm(s + e)}</b></div>`;
}
async function recibir(id) {
  const c = S.cs.find(x => x.id === id), s = subC(c), e = +$('#re').value || 0, f = s ? e / s : 0, up = $('#rpr').checked, now = new Date().toISOString();
  await Promise.all(c.compra_items.filter(i => i.producto_id).map(async i => {
    const cf = Math.round(i.costo * (1 + f) * 100) / 100, u = { costo: cf, costo_actualizado: now };
    if (up) u.precio = Math.round(cf * (1 + S.cfg.margen / 100));
    await db.from('productos').update(u).eq('id', i.producto_id);
    await db.rpc('ajustar_stock', { p_id: i.producto_id, p_delta: i.cantidad });
    await db.from('compra_items').update({ costo_final: cf }).eq('id', i.id);
  }));
  await db.from('compras').update({ envio: e, estado: 'recibida', recibida_el: now }).eq('id', id);
  await cerrar(); await load(); toast('Recibida: stock y costos actualizados'); compras();
}
async function delC(id) { if (!confirm('¿Eliminar esta compra? El stock no se modifica.')) return; await db.from('compras').delete().eq('id', id); await cerrar(); compras(); }

// ---------- Configuración ----------
function config() {
  $('#main').innerHTML = `<h1>Configuración</h1>
  <label>Margen para precio sugerido (%)<input type="number" inputmode="decimal" value="${S.cfg.margen}" onchange="saveM(this.value)"></label>
  <h2>Medios de pago</h2><small>El recargo (%) se suma al total de la venta.</small>
  <div id="mp">${S.medios.map(m => `<div class="item"><div style="flex:1"><input value="${esc(m.nombre)}" onchange="upM(${m.id},'nombre',this.value)"></div><div style="width:84px"><input type="number" inputmode="decimal" value="${m.recargo}" onchange="upM(${m.id},'recargo',this.value)"></div><button class="btn ghost s" onclick="delM(${m.id})">✕</button></div>`).join('')}</div>
  <button class="btn ghost big" onclick="addM()">Agregar medio de pago</button>${listaCfg('categorias', 'Categorías')}${listaCfg('talles', 'Talles')}<button class="btn ghost big" style="margin-top:28px" onclick="salir()">Cerrar sesión</button>`;
}
async function saveM(v) { S.cfg.margen = +v || 0; await db.from('config').update({ margen: S.cfg.margen }).eq('id', 1); toast('Margen guardado'); }
async function upM(id, f, v) { await db.from('medios_pago').update({ [f]: f === 'recargo' ? +v || 0 : v }).eq('id', id); await load(); toast('Guardado'); }
async function addM() { await db.from('medios_pago').insert({ nombre: 'Nuevo medio', recargo: 0 }); await load(); config(); }
async function delM(id) { if (!confirm('¿Eliminar este medio de pago?')) return; await db.from('medios_pago').delete().eq('id', id); await load(); config(); }

// ---------- Categorías y talles ----------
const catOpts = sel => '<option value="">Sin categoría</option>' + S.cats.map(c => `<option value="${c.id}" ${c.id == sel ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('');
const talleOpts = sel => { const l = S.talles.map(t => t.nombre); if (sel && !l.includes(sel)) l.push(sel); return '<option value="">Sin talle</option>' + l.map(t => `<option ${t === sel ? 'selected' : ''}>${esc(t)}</option>`).join(''); };
function listaCfg(t, tit) {
  const l = t === 'talles' ? S.talles : S.cats;
  return `<h2>${tit}</h2>` + l.map(x => `<div class="item"><div style="flex:1"><input value="${esc(x.nombre)}" onchange="upL('${t}',${x.id},this.value)"></div><button class="btn ghost s" onclick="delL('${t}',${x.id})">✕</button></div>`).join('')
    + `<div class="bar" style="margin-top:8px"><input id="n_${t}" placeholder="Nuevo ${t === 'talles' ? 'talle' : 'categoría'}"><button class="btn" onclick="addL2('${t}')">Agregar</button></div>`;
}
async function addL2(t) { const n = $('#n_' + t).value.trim(); if (!n) return; const { error } = await db.from(t).insert({ nombre: n }); if (error) return toast(error.code === '23505' ? 'Ya existe' : error.message); await load(); config(); }
async function upL(t, id, v) {
  v = v.trim(); if (!v) return config();
  const old = (t === 'talles' ? S.talles : S.cats).find(x => x.id === id).nombre;
  const { error } = await db.from(t).update({ nombre: v }).eq('id', id); if (error) { toast('Ya existe'); return config(); }
  if (t === 'talles') await db.from('productos').update({ talle: v }).eq('talle', old);
  await load(); toast('Guardado');
}
async function delL(t, id) {
  const x = (t === 'talles' ? S.talles : S.cats).find(y => y.id === id);
  const n = S.prods.filter(p => t === 'talles' ? p.talle === x.nombre : p.categoria_id === id).length;
  if (!confirm(`¿Eliminar "${x.nombre}"?` + (n ? ` ${n} producto(s) quedarán sin ${t === 'talles' ? 'talle' : 'categoría'}.` : ''))) return;
  if (t === 'talles') await db.from('productos').update({ talle: null }).eq('talle', x.nombre);
  await db.from(t).delete().eq('id', id); await load(); config();
}

// ---------- Estadísticas ----------
async function stats() {
  await load();
  const l = S.prods.filter(p => p.stock > 0), sum = f => l.reduce((s, p) => s + f(p), 0);
  const cost = sum(p => p.stock * p.costo), vta = sum(p => p.stock * p.precio), gan = vta - cost;
  const mv = vta ? gan / vta * 100 : 0, mc = cost ? gan / cost * 100 : 0, sinC = l.filter(p => !+p.costo).length;
  const top = [...l].sort((a, b) => b.stock * b.costo - a.stock * a.costo).slice(0, 10);
  $('#main').innerHTML = `<h1>Estadísticas</h1><small>Stock actual: ${sum(p => p.stock)} unidades en ${l.length} productos</small>
  <div class="card" style="margin-top:12px"><small>Invertido en stock (a costo)</small><div class="big-n" style="color:var(--tx)">${fm(cost)}</div></div>
  <div class="card" style="margin-top:10px"><small>Valor de venta del stock</small><div class="big-n" style="color:var(--tx)">${fm(vta)}</div></div>
  <div class="card" style="margin-top:10px"><small>Ganancia si se vende todo</small><div class="big-n">${fm(gan)}</div>
  <div class="item" style="padding:8px 0"><span>Margen sobre la venta</span><b>${mv.toFixed(1)}%</b></div>
  <div class="item" style="padding:8px 0;border:0"><span>Recargo sobre el costo</span><b>${mc.toFixed(1)}%</b></div></div>
  ${sinC ? `<small style="margin-top:10px">${sinC} producto(s) con stock no tienen costo cargado, por eso la ganancia puede estar sobrestimada.</small>` : ''}
  <h2>Mayor dinero invertido</h2>` + (top.map(p => `<div class="item"><div><b>${esc(p.nombre)}</b><small>${esc(p.talle || '')} · ${p.stock} u. × ${fm(p.costo)}</small></div><div class="r"><b>${fm(p.stock * p.costo)}</b><small>Ganancia ${fm(p.stock * (p.precio - p.costo))}</small></div></div>`).join('') || '<p class="mut">No hay productos con stock.</p>');
}

const V = { inicio, ventas, productos, caja, compras, stats, config };
document.addEventListener('keydown', e => { if (e.key === 'Enter' && !$('#login').hidden) entrar(); if (e.key === 'Escape' && !$('#modal').hidden) cerrar(); });
addEventListener('popstate', () => { if (!$('#modal').hidden) cerrar(); });
(async () => { const { data } = await db.auth.getSession(); data.session ? start() : $('#login').hidden = false; })();
</script>
